syntax = "proto3";

package mototeca.vehicle.v1;

import "google/protobuf/timestamp.proto";

message Vehicle {
  string id = 1;
  string plate = 2;
  string chassi = 3;
  string make = 4;
  string model = 5;
  int32 year = 6;
  // Owner ids stay server-side (ARCHITECTURE.md §8).
  reserved 7;
  reserved "current_owner_id";
  google.protobuf.Timestamp created_at = 8;
}

message GetVehicleByPlateRequest {
  string plate = 1;
}

message GetVehicleByPlateResponse {
  Vehicle vehicle = 1;
}

message CreateVehicleRequest {
  string plate = 1;
  string chassi = 2;
  string make = 3;
  string model = 4;
  int32 year = 5;
}

message CreateVehicleResponse {
  Vehicle vehicle = 1;
}

service VehicleService {
  // Requires a workshop token, since the response carries the chassi.
  // Returns NOT_FOUND if the plate is not registered.
  rpc GetVehicleByPlate(GetVehicleByPlateRequest) returns (GetVehicleByPlateResponse);
  // Requires a workshop or owner token. Returns ALREADY_EXISTS when the plate
  // or the chassi is already registered.
  rpc CreateVehicle(CreateVehicleRequest) returns (CreateVehicleResponse);
}
