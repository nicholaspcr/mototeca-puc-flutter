<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #F7FAFC; color: #0F172A; font-feature-settings: "rlig" 1, "calt" 1; -webkit-font-smoothing: antialiased; }
  ::placeholder { color: #64748B; opacity: 1; }
  a { color: #B84F20; } a:hover { color: #92400E; }
</style>
</helmet>

<div style="width:393px;height:852px;overflow-y:auto;background:#F7FAFC;box-sizing:border-box;">

  <header style="position:sticky;top:0;z-index:5;background:#EAF3FA;border-bottom:1px solid #CFE4F2;">
    <div style="padding:14px 20px;display:flex;align-items:center;gap:10px;">
      <button style="width:32px;height:32px;border-radius:8px;border:1px solid #CFE4F2;background:white;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B4965" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span style="font-size:16px;font-weight:700;letter-spacing:-0.025em;">Cadastrar Oficina</span>
    </div>
  </header>

  <main style="padding:18px 20px 32px;display:flex;flex-direction:column;gap:16px;">
    <p style="margin:0;font-size:13px;color:#64748B;line-height:1.5;">Crie a conta da sua oficina para registrar serviços. O CNPJ é verificado antes do primeiro registro.</p>

    <div style="border:1px solid #E2E8F0;background:white;border-radius:10px;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05);padding:16px;">
      <div style="display:flex;flex-direction:column;gap:14px;">

        <div style="display:flex;flex-direction:column;gap:7px;">
          <label style="font-size:13px;font-weight:500;">CNPJ</label>
          <input placeholder="00.000.000/0001-00" style="height:44px;border-radius:8px;border:1px solid #E2E8F0;padding:0 12px;font-size:16px;font-family:'JetBrains Mono',monospace;outline:none;box-sizing:border-box;width:100%;">
          <span style="font-size:11px;color:#64748B;">Usado para verificar a oficina</span>
        </div>

        <div style="display:flex;flex-direction:column;gap:7px;">
          <label style="font-size:13px;font-weight:500;">Nome da oficina</label>
          <input placeholder="Oficina do Zé" style="height:44px;border-radius:8px;border:1px solid #E2E8F0;padding:0 12px;font-size:16px;outline:none;box-sizing:border-box;width:100%;">
        </div>

        <div style="display:flex;flex-direction:column;gap:7px;">
          <label style="font-size:13px;font-weight:500;">Endereço</label>
          <input placeholder="Rua, número — cidade/UF" style="height:44px;border-radius:8px;border:1px solid #E2E8F0;padding:0 12px;font-size:16px;outline:none;box-sizing:border-box;width:100%;">
        </div>

        <div style="display:flex;flex-direction:column;gap:7px;">
          <label style="font-size:13px;font-weight:500;">Celular (WhatsApp)</label>
          <input placeholder="(31) 90000-0000" style="height:44px;border-radius:8px;border:1px solid #E2E8F0;padding:0 12px;font-size:16px;outline:none;box-sizing:border-box;width:100%;">
        </div>

        <div style="display:flex;flex-direction:column;gap:7px;">
          <label style="font-size:13px;font-weight:500;">Senha</label>
          <input type="password" placeholder="Mínimo de 8 caracteres" style="height:44px;border-radius:8px;border:1px solid #E2E8F0;padding:0 12px;font-size:16px;outline:none;box-sizing:border-box;width:100%;">
        </div>

        <button style="width:100%;height:48px;border-radius:8px;font-size:15px;font-weight:600;border:1px solid transparent;background:#1B4965;color:#F8FAFC;cursor:pointer;margin-top:2px;">Cadastrar Oficina</button>
      </div>
    </div>

    <p style="margin:0;text-align:center;font-size:12px;color:#64748B;line-height:1.5;">Já tem conta? <a href="#" style="text-underline-offset:4px;">Entrar</a></p>
  </main>
</div>

</x-dc>
</body>
</html>
