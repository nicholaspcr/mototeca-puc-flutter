<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: #F7FAFC; color: #0F172A; font-feature-settings: "rlig" 1, "calt" 1; -webkit-font-smoothing: antialiased; }
  ::placeholder { color: #64748B; opacity: 1; }
  a { color: #B84F20; } a:hover { color: #92400E; }
</style>
</helmet>

<div style="width:390px;height:844px;overflow-y:auto;background:#F7FAFC;box-sizing:border-box;">

  <header style="position:sticky;top:0;z-index:5;background:#EAF3FA;border-bottom:1px solid #CFE4F2;">
    <div style="padding:14px 20px;display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:8px;">
        <svg width="22" height="22" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="26" stroke="#1B4965" stroke-width="6"></circle>
          <circle cx="32" cy="32" r="6" fill="#B84F20"></circle>
          <line x1="32" y1="32" x2="52" y2="19" stroke="#B84F20" stroke-width="6" stroke-linecap="round"></line>
          <line x1="32" y1="32" x2="12" y2="19" stroke="#B84F20" stroke-width="6" stroke-linecap="round"></line>
        </svg>
        <span style="font-size:18px;font-weight:700;letter-spacing:-0.025em;">Mototeca</span>
      </div>
      <button style="height:36px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid #E2E8F0;background:white;cursor:pointer;">Sair</button>
    </div>
    <div style="padding:0 20px 12px;font-size:13px;color:#1B4965;font-weight:500;">Olá, Marcos Vinícius</div>
  </header>

  <main style="padding:20px 20px 32px;display:flex;flex-direction:column;gap:16px;">

    <div style="display:flex;align-items:center;justify-content:space-between;">
      <h2 style="margin:0;font-size:16px;font-weight:600;">Minhas Motos</h2>
      <span style="font-size:12px;color:#64748B;">2 veículos</span>
    </div>

    <div style="border:1px solid #E2E8F0;background:white;border-radius:10px;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div style="min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-weight:600;font-family:'JetBrains Mono',monospace;font-size:13px;">ABC1D23</span>
          <span style="font-size:14px;font-weight:600;">Honda CG 160 Start</span>
        </div>
        <div style="font-size:12px;color:#64748B;margin-top:4px;">2022 · Vermelha · 18.420 km</div>
        <div style="margin-top:8px;display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:3px 10px;background:rgba(234,179,8,.14);">
          <span style="width:6px;height:6px;border-radius:50%;background:#EAB308;"></span>
          <span style="font-size:11px;font-weight:600;color:#854D0E;">Troca de óleo em 580 km</span>
        </div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div style="border:1px solid #E2E8F0;background:white;border-radius:10px;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div style="min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-weight:600;font-family:'JetBrains Mono',monospace;font-size:13px;">BRA2E19</span>
          <span style="font-size:14px;font-weight:600;">Yamaha Fazer 250</span>
        </div>
        <div style="font-size:12px;color:#64748B;margin-top:4px;">2021 · Preta · 32.180 km</div>
        <div style="margin-top:8px;display:inline-flex;align-items:center;gap:6px;border-radius:9999px;padding:3px 10px;background:rgba(34,197,94,.14);">
          <span style="width:6px;height:6px;border-radius:50%;background:#22C55E;"></span>
          <span style="font-size:11px;font-weight:600;color:#166534;">Em dia</span>
        </div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <button style="height:48px;border-radius:8px;font-size:15px;font-weight:600;border:1px solid transparent;background:#1B4965;color:#F8FAFC;cursor:pointer;">+ Cadastrar nova moto</button>

    <div style="border:1px solid #CFE4F2;background:#EAF3FA;border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
      <div>
        <div style="font-size:13px;font-weight:600;color:#1B4965;">Lembretes de manutenção</div>
        <div style="font-size:12px;color:#1B4965;margin-top:2px;">1 manutenção próxima</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B4965" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M9 18l6-6-6-6"/></svg>
    </div>

  </main>
</div>

</x-dc>
</body>
</html>
