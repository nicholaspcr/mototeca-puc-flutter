services:
  # The API in a container, reaching Postgres over the compose network. Handy
  # when the Flutter app needs a running backend; `make run` on the host is
  # still the faster loop while editing Go.
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://user:password@db:5432/mototeca?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-in-production}
      STORAGE_ENDPOINT: storage:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: mototeca-photos
      # How the app reaches stored files; the API returns URLs on this host.
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      # Browser origins allowed to call the API. Empty allows localhost only,
      # which covers `flutter run -d chrome`.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_FORMAT: text
      PORT: "8080"
    ports:
      - "8080:8080"

  # S3-compatible object storage for service photos (ARCHITECTURE.md §6).
  storage:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mototeca
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user -d mototeca"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  storage-data:
